<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company Hierarchy Levels</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--fg:#1c2233;--card:#fff;--muted:#6b7385;--accent:#3b5bdb;--ceo:#e8590c;--line:#b8c0d4;--bd:#dde2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--fg:#e8ebf5;--card:#1c2130;--muted:#98a1b8;--accent:#748ffc;--ceo:#ff922b;--line:#4a5370;--bd:#2c3348}}
:root[data-theme="dark"]{--bg:#12151f;--fg:#e8ebf5;--card:#1c2130;--muted:#98a1b8;--accent:#748ffc;--ceo:#ff922b;--line:#4a5370;--bd:#2c3348}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--muted);margin:2px 0 18px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.msg{margin-top:10px;font-size:.88rem;min-height:1.2em}
.err{color:#e03131}.ok{color:#2f9e44}
.stat{display:flex;align-items:baseline;gap:10px}
.big{font-size:2.4rem;font-weight:700;color:var(--accent)}
.lvl{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd);align-items:flex-start}
.lvl b{min-width:72px}
.chip{display:inline-block;padding:2px 10px;margin:2px 4px 2px 0;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:.85rem}
.tree{overflow-x:auto}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Company Hierarchy Levels</h1>
  <div class="sub">B BETINA ROLAND</div>

  <div class="grid">
    <div class="card">
      <h2>Option 1: Enter all boss values</h2>
      <label for="line">Boss of each employee, separated by spaces (-1 for the CEO)</label>
      <input id="line" placeholder="-1 0 0 1 1 2">
      <div class="row">
        <button id="build">Build hierarchy</button>
        <button class="alt" id="sample">Load sample</button>
      </div>
    </div>
    <div class="card">
      <h2>Option 2: Add employees one by one</h2>
      <label id="addlabel" for="one"></label>
      <input id="one" type="number" min="0">
      <div class="row">
        <button id="add">Add employee</button>
        <button class="alt" id="clear">Clear all</button>
      </div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>Total number of levels</h2>
    <div class="stat"><span class="big" id="total">-</span><span class="empty" id="count">No data yet</span></div>
  </div>

  <div class="card">
    <h2>Level-by-level list</h2>
    <div id="list" class="empty">Build a hierarchy to see the levels.</div>
  </div>

  <div class="card">
    <h2>Tree diagram</h2>
    <div id="tree" class="tree empty">Build a hierarchy to see the tree.</div>
  </div>
</div>

<script>
class Queue{constructor(){this.a=[];this.f=0}push(x){this.a.push(x)}pop(){return this.a[this.f++]}size(){return this.a.length-this.f}empty(){return this.f===this.a.length}}
let boss=[];
const $=id=>document.getElementById(id);

function say(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err')}

function validate(b){
  if(b.length<1||b.length>1000)return 'Enter between 1 and 1000 values.';
  if(b[0]!==-1)return 'Employee 0 is the CEO, so its boss must be -1.';
  for(let i=1;i<b.length;i++)if(!Number.isInteger(b[i])||b[i]<0||b[i]>=b.length||b[i]===i)
    return 'Boss of employee '+i+' must be between 0 and '+(b.length-1)+' (not itself).';
  for(let i=0;i<b.length;i++){let c=i,s=0;while(c!==-1&&s<=b.length){c=b[c];s++}
    if(c!==-1)return 'The structure has a cycle, so it is not a valid tree.'}
  return '';
}

function render(){
  const n=boss.length;
  $('addlabel').textContent=n===0?'Employee 0 will be the CEO (boss = -1)':'Boss of employee '+n+' (0 to '+(n-1)+')';
  $('one').style.display=n===0?'none':'block';
  $('add').textContent=n===0?'Add CEO':'Add employee';
  if(n===0){$('total').textContent='-';$('count').textContent='No data yet';
    $('list').className='empty';$('list').textContent='Build a hierarchy to see the levels.';
    $('tree').className='tree empty';$('tree').textContent='Build a hierarchy to see the tree.';return}

  const ch=Array.from({length:n},()=>[]);
  for(let i=1;i<n;i++)ch[boss[i]].push(i);

  const q=new Queue();q.push(0);const levels=[];
  while(!q.empty()){const sz=q.size(),cur=[];
    for(let k=0;k<sz;k++){const v=q.pop();cur.push(v);ch[v].forEach(c=>q.push(c))}
    levels.push(cur)}
  $('total').textContent=levels.length;
  $('count').textContent=n+(n===1?' employee':' employees');

  $('list').className='';
  $('list').innerHTML=levels.map((l,i)=>'<div class="lvl"><b>Level '+(i+1)+'</b><div>'+
    l.map(v=>'<span class="chip">Employee '+v+(v===0?' (CEO)':'')+'</span>').join('')+'</div></div>').join('');

  const xs=[];let leaf=0;
  (function pos(v){if(!ch[v].length){xs[v]=leaf++;return}
    ch[v].forEach(pos);xs[v]=(xs[ch[v][0]]+xs[ch[v][ch[v].length-1]])/2})(0);
  const depth=new Array(n).fill(0);
  levels.forEach((l,i)=>l.forEach(v=>depth[v]=i));
  const gx=64,gy=76,pad=36;
  const W=Math.max(leaf*gx+pad*2,300),H=levels.length*gy+pad;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="system-ui,sans-serif">';
  for(let v=1;v<n;v++){const p=boss[v];
    s+='<line x1="'+(pad+xs[p]*gx)+'" y1="'+(pad/2+depth[p]*gy+20)+'" x2="'+(pad+xs[v]*gx)+'" y2="'+(pad/2+depth[v]*gy)+'" stroke="var(--line)" stroke-width="2"/>'}
  for(let v=0;v<n;v++){const x=pad+xs[v]*gx,y=pad/2+depth[v]*gy+2;
    s+='<circle cx="'+x+'" cy="'+y+'" r="18" fill="'+(v===0?'var(--ceo)':'var(--accent)')+'"/>'+
       '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">'+v+'</text>'}
  $('tree').className='tree';$('tree').innerHTML=s+'</svg>';
}

$('build').onclick=()=>{
  const t=$('line').value.trim();
  if(!/^-?\d+(\s+-?\d+)*$/.test(t)){say('Invalid input. Use only whole numbers separated by spaces.');return}
  const b=t.split(/\s+/).map(Number),e=validate(b);
  if(e){say(e);return}
  boss=b;render();say('Hierarchy built with '+b.length+' employees.',true);
};
$('sample').onclick=()=>{$('line').value='-1 0 0 1 1 2';$('build').click()};
$('add').onclick=()=>{
  if(boss.length===0){boss=[-1];render();say('Employee 0 added as the CEO.',true);return}
  const v=$('one').value;const b=Number(v);
  if(v===''||!Number.isInteger(b)||b<0||b>=boss.length){say('Boss must be a whole number from 0 to '+(boss.length-1)+'.');return}
  if(boss.length>=1000){say('Maximum is 1000 employees.');return}
  boss.push(b);$('one').value='';render();say('Employee '+(boss.length-1)+' added under employee '+b+'.',true);
};
$('one').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
$('line').addEventListener('keydown',e=>{if(e.key==='Enter')$('build').click()});
$('clear').onclick=()=>{boss=[];$('line').value='';render();say('All data cleared.',true)};
render();
</script>
</body>
</html>
